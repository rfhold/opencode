services:
  functions-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.functions-selfhost
    container_name: opencode-functions-api
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - HOST=0.0.0.0
      - WEB_DOMAIN=localhost:4321
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: opencode-web
    ports:
      - "4321:4321"
    environment:
      - VITE_PUBLIC_API_URL=http://localhost:3000
      - VITE_API_URL=http://functions-api:3000
      - HOST=0.0.0.0
    restart: unless-stopped
